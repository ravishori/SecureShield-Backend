name: backend-ci

on:
  push:
    branches: [main, "staging/**"]
  pull_request:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (unit + PostgreSQL integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: secureshield_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Loopback host + "_test" suffix are required by the harness guard
      # (tests/integration/conftest.py); anything else makes it refuse to run.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/secureshield_ci_test
      # Settings() requires every field even for `alembic upgrade head`; there is no
      # .env in CI. All values are inert placeholders (no network is contacted).
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/secureshield_ci_test
      MIGRATOR_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/secureshield_ci_test
      SECRET_KEY: ci-only-secret-key-not-used-outside-github-actions
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_USER: ci@example.com
      SMTP_PASSWORD: ci-placeholder
      SMTP_FROM_EMAIL: ci@example.com
      ERROR_NOTIFY_EMAIL: ci@example.com
      TWILIO_ACCOUNT_SID: ACci
      TWILIO_AUTH_TOKEN: ci-placeholder
      TWILIO_SMS_NUMBER: "+15555555555"
      TWILIO_WHATSAPP_NUMBER: "+15555555555"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio ruff
      - name: Secret scan (gitleaks, current tree)
        # Pinned release + checksum. --no-git on purpose: the repository history still holds
        # secrets that were committed before rotation (tracked in the issue register); scanning
        # the tree keeps new leaks out. Project rules + exact-value fixture allowlist (no path
        # allowlist): .gitleaks.toml. The binary is kept outside the scanned tree ($RUNNER_TEMP).
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --no-git --source . --config .gitleaks.toml --redact --no-banner
      - name: Lint (syntax errors / undefined names only)
        run: ruff check app tests --select E9,F63,F7,F82
      - name: Lint and format (project standard)
        run: |
          pip install ruff==0.9.4
          ruff check app tests scripts
          ruff format --check app tests scripts
      - name: Dependency vulnerability scan (runtime packages; no Docker)
        # pip-audit lives in its own venv so it never changes what is tested. The audited environment is the one just
        # installed from requirements.txt. A finding fails the build; do not suppress without a written justification.
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/pip" install --quiet pip-audit==2.10.1
          python -m pip install --quiet --upgrade pip setuptools
          "$RUNNER_TEMP/audit/bin/pip-audit" --path "$(python -c 'import sysconfig;print(sysconfig.get_paths()["purelib"])')" --progress-spinner off
      - name: Apply migrations to a blank database (validates the whole chain)
        run: python -m alembic upgrade head
      - name: Run tests
        run: python -m pytest tests -q -ra
