# Railway config-as-code for the secureshield-api service.
# Build from the Dockerfile at the repo root; migrations run as a pre-deploy
# step (before the new version starts; a failure blocks the deploy).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = "alembic upgrade head"
healthcheckPath = "/health"
healthcheckTimeout = 60
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
